services:
  - type: web
    name: krateon-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: krateon-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: krateon-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: krateon-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: krateon-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: krateon-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: krateon-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: keyvalue
    name: krateon-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: krateon-db
    plan: free
    databaseName: krateon_db
    user: krateon
