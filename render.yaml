services:
  - type: web
    name: krateon-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: krateon-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: keyvalue
    name: krateon-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
