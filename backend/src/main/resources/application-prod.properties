# Production profile - every secret/host comes from environment variables.
# Activated with SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets this).
spring.application.name=krateon
server.port=${PORT:8080}

# PostgreSQL - either set DB_URL (full JDBC URL) or DB_HOST/DB_PORT/DB_NAME
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT - generate with `openssl rand -hex 64`
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Redis - a single URL, e.g. rediss://default:password@host:6379
spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Comma-separated list of allowed browser origins (storefront + admin URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
